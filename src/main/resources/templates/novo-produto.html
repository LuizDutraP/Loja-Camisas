<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto | Oversized Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background: #fff;
            padding: 40px;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 6px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            border-color: #111;
        }
        .btn {
            background: #111;
            color: #fff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #333;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover {
            color: #111;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Cadastrar Camiseta</h2>

    <!-- Formulário mapeado com Thymeleaf para a classe Produto -->
    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">

        <div class="input-group">
            <label>Nome da Camiseta</label>
            <input type="text" th:field="*&#123;nome&#125;" required placeholder="Ex: Oversized Grace">
        </div>

        <div class="input-group">
            <label>Descrição</label>
            <textarea th:field="*&#123;descricao&#125;" rows="3" required placeholder="Detalhes do tecido e estampa..."></textarea>
        </div>

        <div class="input-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" th:field="*&#123;preco&#125;" required placeholder="89.90">
        </div>

        <div class="input-group">
            <label>Tamanho</label>
            <input type="text" th:field="*&#123;tamanho&#125;" required placeholder="Ex: G ou Oversized GG">
        </div>

        <div class="input-group">
            <label>Categoria</label>
            <input type="text" th:field="*&#123;categoria&#125;" required placeholder="Ex: Cristã / Minimalista">
        </div>

        <div class="input-group">
            <label>Link da Imagem (URL)</label>
            <input type="text" th:field="*&#123;imagemUrl&#125;" required placeholder="https://...">
        </div>

        <button type="submit" class="btn">Salvar Produto</button>
    </form>

    <a href="/" class="back-link">← Voltar para a Loja</a>
</div>

</body>
</html>
