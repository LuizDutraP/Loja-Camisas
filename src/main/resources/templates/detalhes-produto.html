<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produto.nome} + ' | Oversized Store'">Detalhes do Produto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #fff;
            color: #111;
            padding: 40px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .product-image {
            width: 100%;
            height: auto;
            border-radius: 4px;
            background-color: #f9f9f9;
            object-fit: cover;
            max-height: 550px;
        }
        .product-info h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .category {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 8px;
        }
        .price {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .description {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .size-box {
            margin-bottom: 24px;
        }
        .size-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }
        .size-badge {
            display: inline-block;
            border: 1px solid #111;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 4px;
        }
        .btn-buy {
            background: #111;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .btn-buy:hover {
            background: #333;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover {
            color: #111;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Imagem do Produto -->
    <div>
        <img th:src="${produto.imagemUrl}" alt="Foto da Camiseta" class="product-image">
    </div>

    <!-- Informações do Produto -->
    <div class="product-info">
        <span class="category" th:text="${produto.categoria}">Categoria</span>
        <h1 th:text="${produto.nome}">Nome do Produto</h1>
        <div class="price" th:text="'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>

        <p class="description" th:text="${produto.descricao}">Descrição detalhada do produto...</p>

        <div class="size-box">
            <span class="size-label">Tamanho Disponível</span>
            <span class="size-badge" th:text="${produto.tamanho}">G</span>
        </div>

        <button class="btn-buy" onclick="alert('Funcionalidade de carrinho em breve!')">Adicionar ao Carrinho</button>

        <a href="/" class="back-link">← Voltar para a Loja</a>
    </div>
</div>

</body>
</html>
