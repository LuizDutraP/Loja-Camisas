<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oversized Store | Essência & Estilo</title>
    <!-- Fonte moderna e minimalista do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #111;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
        }
        header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        header p {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }
        .card {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-img {
            width: 100%;
            height: 350px;
            background-color: #eee;
            object-fit: cover;
        }
        .card-body {
            padding: 20px;
        }
        .categoria {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 5px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .preco {
            font-size: 16px;
            font-weight: 600;
        }
        .btn {
            background: #111;
            color: #fff;
            border: none;
            padding: 10px 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #333;
        }
    </style>
</head>
<body>

<header>
        <h1>Oversized Store</h1>
        <p>Moda Cristã & Minimalista • Essência que Vestem</p>
        <div style="margin-top: 15px;">
            <a href="/produtos/novo" style="font-size: 13px; color: #111; text-decoration: none; border: 1px solid #111; padding: 6px 12px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px;">+ Cadastrar Produto</a>
        </div>
    <h1>Oversized Store</h1>
    <p>Moda Cristã & Minimalista • Essência que Vestem</p>
</header>

<div class="container">
    <div class="grid">
        <!-- Loop do Thymeleaf para percorrer a lista de produtos vinda do Java -->
        <!-- Loop do Thymeleaf para percorrer a lista de produtos vinda do Java -->
        <div class="card" th:each="produto : ${produtos}">
            <!-- Link na imagem levando para a página de detalhes do produto -->
            <a th:href="@{/produto/{id}(id=${produto.id})}">
                <img class="card-img" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="Camiseta Oversized">
            </a>

            <div class="card-body">
                <div class="categoria" th:text="${produto.categoria}">Categoria</div>

                <!-- Link no título levando para a página de detalhes do produto -->
                <a th:href="@{/produto/{id}(id=${produto.id})}" style="text-decoration: none; color: inherit;">
                    <h3 class="card-title" th:text="${produto.nome}">Nome do Produto</h3>
                </a>

                <p class="card-desc" th:text="${produto.descricao}">Descrição breve da camiseta.</p>
                <div class="card-footer">
                    <span class="preco" th:text="'R$ ' + ${produto.preco}">R$ 0,00</span>
                    <a th:href="@{/produto/{id}(id=${produto.id})}" class="btn" style="text-decoration: none; text-align: center; display: inline-block;">Comprar</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
